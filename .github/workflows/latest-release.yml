name: Version release

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            artifact: darkspinner-win32
            archive: bin/darkspinnerci/darkspinner-win32-v*.zip
            update_asset: bin/darkspinnerci/darkspinner.exe
          - name: Linux
            os: ubuntu-24.04
            artifact: darkspinner-linux
            archive: bin/darkspinnerci/darkspinner-linux-v*.zip
            update_asset: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mingw-w64 \
            pkg-config

      - name: Set up 32-bit MinGW
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Add 32-bit MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify 32-bit MinGW
        if: runner.os == 'Windows'
        run: i686-w64-mingw32-gcc --version

      - name: Install build tools
        run: |
          npm install --global pnpm@10
          go install github.com/magefile/mage@v1.15.0
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build native release archive
        run: mage darkspinner:buildcinative

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.update_asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish version
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: darkspinner-*
          path: bin/darkspinnerci
          merge-multiple: true

      - name: Resolve release archives
        id: archives
        shell: bash
        run: |
          shopt -s nullglob
          windows_archives=(bin/darkspinnerci/darkspinner-win32-v*.zip)
          linux_archives=(bin/darkspinnerci/darkspinner-linux-v*.zip)
          if (( ${#windows_archives[@]} != 1 )); then
            echo "Expected exactly one Windows archive, found ${#windows_archives[@]}" >&2
            exit 1
          fi
          if (( ${#linux_archives[@]} != 1 )); then
            echo "Expected exactly one Linux archive, found ${#linux_archives[@]}" >&2
            exit 1
          fi
          windows_name="${windows_archives[0]##*/}"
          release_version="${windows_name#darkspinner-win32-v}"
          release_version="${release_version%.zip}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${release_version}" =~ ${semver_pattern} ]]; then
            echo "Invalid release version in ${windows_name}" >&2
            exit 1
          fi
          linux_name="${linux_archives[0]##*/}"
          if [[ "${linux_name}" != "darkspinner-linux-v${release_version}.zip" ]]; then
            echo "Archive versions do not match: ${windows_name}, ${linux_name}" >&2
            exit 1
          fi
          echo "windows=${windows_archives[0]}" >> "$GITHUB_OUTPUT"
          echo "linux=${linux_archives[0]}" >> "$GITHUB_OUTPUT"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Prepare Windows self-update manifest
        env:
          RELEASE_VERSION: ${{ steps.archives.outputs.version }}
        shell: bash
        run: |
          executable_path=bin/darkspinnerci/darkspinner.exe
          executable_digest="$(sha256sum "${executable_path}" | cut -d ' ' -f 1)"
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/darkspinner.exe" \
            --arg sha256 "${executable_digest}" \
            '{version: $version, url: $url, sha256: $sha256}' \
            > bin/darkspinnerci/darkspinner-update.json

      - name: Publish version and pivot latest
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ARCHIVE: ${{ steps.archives.outputs.windows }}
          LINUX_ARCHIVE: ${{ steps.archives.outputs.linux }}
          VERSION_TAG: v${{ steps.archives.outputs.version }}
        shell: bash
        run: |
          release_assets=(
            "${WINDOWS_ARCHIVE}"
            "${LINUX_ARCHIVE}"
            bin/darkspinnerci/darkspinner.exe
            bin/darkspinnerci/darkspinner-update.json
          )
          version_core="${VERSION_TAG%%+*}"
          is_prerelease=false
          if [[ "${version_core}" == *-* ]]; then
            is_prerelease=true
          fi
          release_notes="Darkspinner ${VERSION_TAG} snapshot from release at [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
          previous_tag=""
          if ! previous_tag="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name' \
              2>/dev/null
          )"; then
            previous_tag=""
          fi
          if [[ -n "${previous_tag}" && "${previous_tag}" != "${VERSION_TAG}" ]]; then
            commit_notes="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_SHA}" \
                --paginate \
                --jq '.commits[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"'
            )"
            if [[ -n "${commit_notes}" ]]; then
              release_notes+=$'\n\n## Changes since previous release\n\n'
              release_notes+="${commit_notes}"
            fi
          fi
          existing_version_sha=""
          if ! existing_version_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${VERSION_TAG}" \
              --jq '.sha' \
              2>/dev/null
          )"; then
            existing_version_sha=""
          fi
          if [[ -n "${existing_version_sha}" && "${existing_version_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error title=Version tag conflict::${VERSION_TAG} already tags ${existing_version_sha}; current build is ${GITHUB_SHA}. Bump the Mage release version before publishing this commit."
            exit 1
          fi
          if gh release view "${VERSION_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION_TAG}" \
              "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${VERSION_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Darkspinner ${VERSION_TAG}" \
              --prerelease="${is_prerelease}" \
              --notes "${release_notes}"
          else
            version_arguments=(--target "${GITHUB_SHA}")
            if [[ -n "${existing_version_sha}" ]]; then
              version_arguments=(--verify-tag)
            fi
            gh release create "${VERSION_TAG}" \
              "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${version_arguments[@]}" \
              --title "Darkspinner ${VERSION_TAG}" \
              --prerelease="${is_prerelease}" \
              --latest=false \
              --notes "${release_notes}"
          fi
          if [[ "${is_prerelease}" == true ]]; then
            exit 0
          fi
          mapfile -t rolling_release_tags < <(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "latest" or (.tag_name | startswith("latest-"))) | .tag_name'
          )
          for rolling_tag in "${rolling_release_tags[@]}"; do
            gh release delete "${rolling_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --yes \
              --cleanup-tag
          done
          mapfile -t rolling_refs < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/latest-" \
              --jq '.[].ref'
          )
          for rolling_ref in "${rolling_refs[@]}"; do
            rolling_tag="${rolling_ref#refs/tags/}"
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${rolling_tag}"
          done
          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest"
          fi
          gh release edit "${VERSION_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --latest
          published_latest_tag="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name'
          )"
          if [[ "${published_latest_tag}" != "${VERSION_TAG}" ]]; then
            echo "::error title=Latest release mismatch::Expected ${VERSION_TAG}, but GitHub reports ${published_latest_tag}."
            exit 1
          fi
