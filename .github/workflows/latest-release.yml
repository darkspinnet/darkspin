name: Version release

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    env:
      DARKSPINNER_GOARCH: ${{ matrix.arch }}
      DARKSPINNER_UPDATE_URL: https://github.com/darkspinnet/darkspin/releases/latest/download/darkspinner-update-${{ matrix.name }}.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2022
            arch: amd64
          - name: windows-win32
            os: windows-2022
            arch: 386
          - name: darwin-amd64
            os: macos-15-intel
            arch: amd64
          - name: darwin-arm64
            os: macos-15
            arch: arm64
          - name: linux-amd64
            os: ubuntu-24.04
            arch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mingw-w64 \
            pkg-config

      - name: Install macOS cross compiler
        if: runner.os == 'macOS'
        run: brew install mingw-w64

      - name: Set up 32-bit MinGW
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Add 32-bit MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify 32-bit MinGW
        if: runner.os == 'Windows'
        run: i686-w64-mingw32-gcc --version

      - name: Install build tools
        run: |
          npm install --global pnpm@10
          go install github.com/magefile/mage@v1.15.0
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build native release archive
        run: mage darkspinner:buildcinative

      - name: Generate Windows update manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath magefile.go -Pattern '^const releaseSemver = "([^"]+)"').Matches.Groups[1].Value
          $digest = (Get-FileHash -LiteralPath bin/darkspinnerci/darkspinner.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = $version
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/darkspinner-${{ matrix.name }}.zip"
            sha256 = $digest
            format = 'zip'
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath bin/darkspinnerci/darkspinner-update-${{ matrix.name }}.json -Encoding utf8NoBOM

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: darkspinner-${{ matrix.name }}
          path: |
            bin/darkspinnerci/darkspinner-${{ matrix.name }}-v*.zip
            bin/darkspinnerci/darkspinner-update-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  darkrun:
    name: Build Darkrun ${{ matrix.platform }}-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0

      - name: Build Darkrun archive
        run: mage darkrun:buildci ${{ matrix.platform }}

      - name: Upload Darkrun archive
        uses: actions/upload-artifact@v4
        with:
          name: darkrun-${{ matrix.platform }}-amd64
          path: bin/darkrunci/${{ matrix.platform }}-amd64/darkrun-${{ matrix.platform }}-amd64-v*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish version
    needs: [build, darkrun]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: darkspinner-*
          path: bin/darkspinnerci
          merge-multiple: true

      - name: Download Darkrun archives
        uses: actions/download-artifact@v4
        with:
          pattern: darkrun-*
          path: bin/darkrunci
          merge-multiple: true

      - name: Resolve release archives
        id: archives
        shell: bash
        run: |
          shopt -s nullglob
          platforms=(windows-amd64 windows-win32 darwin-amd64 darwin-arm64 linux-amd64 linux-arm64)
          release_version=""
          for platform in "${platforms[@]}"; do
            archives=(bin/darkspinnerci/darkspinner-"${platform}"-v*.zip)
            if (( ${#archives[@]} != 1 )); then
              echo "Expected one ${platform} archive, found ${#archives[@]}" >&2
              exit 1
            fi
            archive_name="${archives[0]##*/}"
            version="${archive_name#darkspinner-${platform}-v}"
            version="${version%.zip}"
            semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "${version}" =~ ${semver_pattern} ]]; then
              echo "Invalid release version: ${version}" >&2
              exit 1
            fi
            if [[ -n "${release_version}" && "${version}" != "${release_version}" ]]; then
              echo "Archive version mismatch: ${archive_name}" >&2
              exit 1
            fi
            release_version="${version}"
            cp "${archives[0]}" "bin/darkspinnerci/darkspinner-${platform}.zip"
          done
          for platform in windows-amd64 linux-amd64; do
            archives=(bin/darkrunci/darkrun-"${platform}"-v*.zip)
            if (( ${#archives[@]} != 1 )); then
              echo "Expected one Darkrun ${platform} archive, found ${#archives[@]}" >&2
              exit 1
            fi
            archive_name="${archives[0]##*/}"
            if [[ "${archive_name}" != "darkrun-${platform}-v${release_version}.zip" ]]; then
              echo "Darkrun version mismatch: ${archive_name}" >&2
              exit 1
            fi
            cp "${archives[0]}" "bin/darkrunci/darkrun-${platform}.zip"
          done
          # Keep installed x86 launchers on their original manifest endpoint.
          cp bin/darkspinnerci/darkspinner-update-windows-win32.json bin/darkspinnerci/darkspinner-update.json
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Publish version and pivot latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: v${{ steps.archives.outputs.version }}
        shell: bash
        run: |
          release_assets=(
            bin/darkrunci/darkrun-windows-amd64.zip
            bin/darkrunci/darkrun-linux-amd64.zip
            bin/darkspinnerci/darkspinner-windows-amd64.zip
            bin/darkspinnerci/darkspinner-windows-win32.zip
            bin/darkspinnerci/darkspinner-darwin-amd64.zip
            bin/darkspinnerci/darkspinner-darwin-arm64.zip
            bin/darkspinnerci/darkspinner-linux-amd64.zip
            bin/darkspinnerci/darkspinner-linux-arm64.zip
            bin/darkspinnerci/darkspinner-update-windows-amd64.json
            bin/darkspinnerci/darkspinner-update-windows-win32.json
            bin/darkspinnerci/darkspinner-update.json
          )
          version_core="${VERSION_TAG%%+*}"
          is_prerelease=false
          if [[ "${version_core}" == *-* ]]; then
            is_prerelease=true
          fi
          release_notes="Darkspinner ${VERSION_TAG} snapshot from release at [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
          previous_tag=""
          if ! previous_tag="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name' \
              2>/dev/null
          )"; then
            previous_tag=""
          fi
          if [[ -n "${previous_tag}" && "${previous_tag}" != "${VERSION_TAG}" ]]; then
            commit_notes="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_SHA}" \
                --paginate \
                --jq '.commits[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"'
            )"
            if [[ -n "${commit_notes}" ]]; then
              release_notes+=$'\n\n## Changes since previous release\n\n'
              release_notes+="${commit_notes}"
            fi
          fi
          printf '%s\n' "${release_notes}" > release-notes.md
          existing_version_sha=""
          if ! existing_version_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${VERSION_TAG}" \
              --jq '.sha' \
              2>/dev/null
          )"; then
            existing_version_sha=""
          fi
          if [[ -n "${existing_version_sha}" && "${existing_version_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error title=Version tag conflict::${VERSION_TAG} already tags ${existing_version_sha}; current build is ${GITHUB_SHA}. Bump the Mage release version before publishing this commit."
            exit 1
          fi
          if gh release view "${VERSION_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION_TAG}" \
              "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${VERSION_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Darkspinner ${VERSION_TAG}" \
              --prerelease="${is_prerelease}" \
              --notes-file release-notes.md
          else
            version_arguments=(--target "${GITHUB_SHA}")
            if [[ -n "${existing_version_sha}" ]]; then
              version_arguments=(--verify-tag)
            fi
            gh release create "${VERSION_TAG}" \
              "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${version_arguments[@]}" \
              --title "Darkspinner ${VERSION_TAG}" \
              --prerelease="${is_prerelease}" \
              --latest=false \
              --notes-file release-notes.md
          fi
          if [[ "${is_prerelease}" == true ]]; then
            exit 0
          fi
          mapfile -t rolling_release_tags < <(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "latest" or (.tag_name | startswith("latest-"))) | .tag_name'
          )
          for rolling_tag in "${rolling_release_tags[@]}"; do
            gh release delete "${rolling_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --yes \
              --cleanup-tag
          done
          mapfile -t rolling_refs < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/latest-" \
              --jq '.[].ref'
          )
          for rolling_ref in "${rolling_refs[@]}"; do
            rolling_tag="${rolling_ref#refs/tags/}"
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${rolling_tag}"
          done
          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest"
          fi
          gh release edit "${VERSION_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --latest
          published_latest_tag="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name'
          )"
          if [[ "${published_latest_tag}" != "${VERSION_TAG}" ]]; then
            echo "::error title=Latest release mismatch::Expected ${VERSION_TAG}, but GitHub reports ${published_latest_tag}."
            exit 1
          fi
