name: Unstable artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unstable-artifacts
  cancel-in-progress: true

jobs:
  version:
    name: Resolve unstable version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          release_version="$(sed -n 's/^const releaseSemver = "\([^"]*\)"/\1/p' magefile.go)"
          version_core="${release_version%%[-+]*}"
          if [[ ! "${version_core}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unable to resolve the Mage release version" >&2
            exit 1
          fi
          echo "version=${version_core}-unstable.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}+g${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    env:
      DARKSPINNER_GOARCH: ${{ matrix.arch }}
      DARKSPIN_BUILD_VERSION: ${{ needs.version.outputs.version }}
      DARKSPINNER_UPDATE_URL: https://nightly.link/darkspinnet/darkspin/workflows/main-build/main/darkspinner-update-${{ matrix.name }}-unstable.zip
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2022
            arch: amd64
          - name: windows-win32
            os: windows-2022
            arch: 386
          - name: darwin-amd64
            os: macos-15-intel
            arch: amd64
          - name: darwin-arm64
            os: macos-15
            arch: arm64
          - name: linux-amd64
            os: ubuntu-24.04
            arch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            mingw-w64 \
            pkg-config

      - name: Install macOS cross compiler
        if: runner.os == 'macOS'
        run: brew install mingw-w64

      - name: Set up 32-bit MinGW
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc

      - name: Add 32-bit MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify 32-bit MinGW
        if: runner.os == 'Windows'
        run: i686-w64-mingw32-gcc --version

      - name: Install build tools
        run: |
          npm install --global pnpm@10
          go install github.com/magefile/mage@v1.15.0
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build native archive
        run: mage darkspinner:buildcinative

      - name: Upload branch artifact
        id: binary
        uses: actions/upload-artifact@v4
        with:
          name: darkspinner-${{ matrix.name }}-unstable
          path: ${{ runner.os == 'Windows' && 'bin/darkspinnerci/darkspinner.exe' || format('bin/darkspinnerci/darkspinner-{0}-v*.zip', matrix.name) }}
          if-no-files-found: error
          retention-days: 14

      - name: Generate unstable update manifest
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY_ARTIFACT_ID: ${{ steps.binary.outputs.artifact-id }}
        run: |
          $digest = (Get-FileHash -LiteralPath bin/darkspinnerci/darkspinner.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = $env:DARKSPIN_BUILD_VERSION
            url = "https://nightly.link/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BINARY_ARTIFACT_ID.zip"
            sha256 = $digest
            format = 'zip'
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath bin/darkspinnerci/darkspinner-update.json -Encoding utf8NoBOM

      - name: Upload unstable update manifest
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: darkspinner-update-${{ matrix.name }}-unstable
          path: bin/darkspinnerci/darkspinner-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve the original unstable x86 update endpoint
        if: matrix.name == 'windows-win32'
        uses: actions/upload-artifact@v4
        with:
          name: darkspinner-update-unstable
          path: bin/darkspinnerci/darkspinner-update.json
          if-no-files-found: error
          retention-days: 14

  darkrun:
    name: Build Darkrun ${{ matrix.platform }}-amd64
    needs: version
    env:
      DARKSPIN_BUILD_VERSION: ${{ needs.version.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0

      - name: Build Darkrun archive
        run: mage darkrun:buildci ${{ matrix.platform }}

      - name: Upload Darkrun archive
        uses: actions/upload-artifact@v4
        with:
          name: darkrun-${{ matrix.platform }}-amd64-unstable
          path: bin/darkrunci/${{ matrix.platform }}-amd64/darkrun-${{ matrix.platform }}-amd64-v*.zip
          if-no-files-found: error
          retention-days: 14
