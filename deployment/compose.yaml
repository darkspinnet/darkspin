name: darkspin
services:
  darkrun:
    image: "${DARKSPIN_BOOTSTRAP_IMAGE:-ghcr.io/darkspinnet/darkrun-bootstrap:1}"
    environment:
      DARKSPIN_BOOTSTRAP_PATH: /darkspin
      DARKSPIN_ADVERTISED_HOST: "${DARKSPIN_ADVERTISED_HOST:?Set DARKSPIN_ADVERTISED_HOST to the reachable server IPv4 address}"
      DARKSPIN_IS_DEDICATED: "true"
      DARKSPIN_BIND_HOST: "${DARKSPIN_BIND_HOST:-0.0.0.0}"
      DARKSPIN_PORT: "${DARKSPIN_PORT:-42127}"
      DARKSPIN_GAME_PATH: /game
      # Empty inputs reuse saved [bootstrap] settings. Fresh defaults: daily
      # 03:30 UTC, 30m warning, 30m startup timeout, seven days of backups.
      DARKSPIN_IS_UPDATE_ENABLED: "${DARKSPIN_IS_UPDATE_ENABLED:-}"
      DARKSPIN_UPDATE_CRON: "${DARKSPIN_UPDATE_CRON:-}"
      DARKSPIN_UPDATE_WARNING_MINUTES: "${DARKSPIN_UPDATE_WARNING_MINUTES:-}"
      DARKSPIN_UPDATE_START_TIMEOUT_SECONDS: "${DARKSPIN_UPDATE_START_TIMEOUT_SECONDS:-}"
      DARKSPIN_BACKUP_RETENTION_DAYS: "${DARKSPIN_BACKUP_RETENTION_DAYS:-}"
      DARKSPIN_UPDATE_MANIFEST_URL: "${DARKSPIN_UPDATE_MANIFEST_URL:-}"
    ports:
      - "${DARKSPIN_PORT:-42127}:${DARKSPIN_PORT:-42127}/tcp"
      - "${DARKSPIN_PORT:-42127}:${DARKSPIN_PORT:-42127}/udp"
    volumes:
      - type: bind
        source: "${DARKSPIN_HOME_PATH:-./darkspin}"
        target: /darkspin
        bind:
          create_host_path: false
      - type: bind
        source: "${DARKSPIN_GAME_HOST_PATH:?Set the required build-103 game installation directory}"
        target: /game
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "/darkspin/bin/darkrun", "maintenance", "status", "--ready", "--config", "/darkspin/runtime/darkspin.toml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
